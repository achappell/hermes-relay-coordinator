[project]
name = "hermes-relay-coordinator"
version = "0.1.0"
description = "Read-only coordination and status reporting for Hermes surface repositories"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "PyYAML>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88
